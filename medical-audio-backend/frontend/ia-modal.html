<!-- Modal de Reconocimiento Asistido por IA -->
<link rel="stylesheet" href="ia-modal.css">

<div id="modal-ia" class="modal-ia-overlay" style="display:none">
  <div class="modal-ia-box">

    <!-- Estado 1: Listo para usar -->
    <div id="ia-step-ready">
      <h3>Reconocimiento Asistido por IA</h3>
      <p>Grabá la consulta o subí un audio ya grabado</p>

      <button id="btn-grabar" class="ia-btn ia-btn-primary" onclick="iniciarGrabacion()">
        🎙 Grabar ahora
      </button>

      <label for="input-audio" class="ia-btn ia-btn-secondary">
        📁 Subir archivo
        <input type="file" id="input-audio" accept=".mp3,.wav,.m4a,.webm,.ogg"
               onchange="subirAudio(this.files[0])" hidden>
      </label>

      <button class="ia-btn ia-btn-cancel" onclick="cerrarModal()">Cancelar</button>
    </div>

    <!-- Estado 2: Procesando -->
    <div id="ia-step-processing" style="display:none">
      <div class="ia-spinner"></div>
      <p id="ia-status-text">Transcribiendo audio...</p>
      <small>Esto puede tardar 1-3 minutos</small>
    </div>

    <!-- Estado 3: Previsualización del resultado -->
    <div id="ia-step-preview" style="display:none">
      <h3>Revisá el resultado antes de confirmar</h3>
      <div id="ia-preview-content"></div>
      <p id="ia-datos-adicionales"></p>

      <button class="ia-btn ia-btn-primary" onclick="confirmarResultado()">
        ✓ Confirmar y rellenar
      </button>
      <button class="ia-btn ia-btn-secondary" onclick="volverAGrabar()">
        ↩ Volver a grabar
      </button>
    </div>

  </div>
</div>

<script src="ia-integration.js"></script>
